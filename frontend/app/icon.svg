<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 44" fill="none">
  <!-- Card body -->
  <rect x="1" y="1" width="34" height="42" rx="3" fill="#ff4655"/>
  <!-- Depth gradient overlay -->
  <rect x="1" y="1" width="34" height="42" rx="3" fill="url(#g)"/>
  <!-- Corner ticks (radianite teal) -->
  <path d="M5 10 L5 5 L10 5" stroke="#00e5bc" stroke-width="1.8" stroke-linecap="square" fill="none"/>
  <path d="M31 10 L31 5 L26 5" stroke="#00e5bc" stroke-width="1.8" stroke-linecap="square" fill="none"/>
  <path d="M5 34 L5 39 L10 39" stroke="#00e5bc" stroke-width="1.8" stroke-linecap="square" fill="none"/>
  <path d="M31 34 L31 39 L26 39" stroke="#00e5bc" stroke-width="1.8" stroke-linecap="square" fill="none"/>
  <!-- Targeting reticle -->
  <circle cx="18" cy="22" r="7" stroke="#0f111a" stroke-width="1.6" fill="none"/>
  <line x1="18" y1="13" x2="18" y2="18" stroke="#0f111a" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="18" y1="26" x2="18" y2="31" stroke="#0f111a" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="9"  y1="22" x2="14" y2="22" stroke="#0f111a" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="22" y1="22" x2="27" y2="22" stroke="#0f111a" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="18" cy="22" r="2" fill="#0f111a"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
</svg>
